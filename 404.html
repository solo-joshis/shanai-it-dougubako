<head>

  <title>社内IT道具箱は移転しました</title>
  <link rel="canonical" href="https://it-dougubako.com/">
  <script>(function () {
  var p = location.pathname;
  if (p === '/shanai-it-dougubako' || p.indexOf('/shanai-it-dougubako/') === 0) p = p.slice(20);
  if (p.charAt(0) !== '/') p = '/' + p;
  p = p.replace(/^\/+/, '/');
  location.replace('https://it-dougubako.com' + p + location.search + location.hash);
})();</script>
</head>
<body>
  <p>社内IT道具箱は <a href="https://it-dougubako.com/">https://it-dougubako.com/</a> に移転しました。自動で移動しない場合は、リンクを開いてください。</p>
